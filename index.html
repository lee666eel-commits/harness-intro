<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>工作线记忆框架</title>
<style>
:root{--bg:#f7f4ee;--fg:#22201c;--muted:#78716a;--line:#ddd5c8;--accent:#9a3b26;--card:#fffdf9}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--fg:#e9e4dc;--muted:#9a928a;--line:#3a352f;--accent:#e08b6f;--card:#201d1a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.9 "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:56px 20px 80px}
h1,h2{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,SimSun,serif;font-weight:700;letter-spacing:.04em}
h1{font-size:30px;line-height:1.4;margin:0 0 6px}
h1+p{color:var(--muted);margin:0 0 48px;padding-bottom:28px;border-bottom:1px solid var(--line)}
h2{font-size:21px;margin:52px 0 14px;padding-left:12px;border-left:3px solid var(--accent)}
p,li{text-align:justify}
ul,ol{padding-left:1.4em}
li{margin:4px 0}
strong{color:var(--accent);font-weight:600}
code{font-size:.9em;background:var(--card);border:1px solid var(--line);padding:0 4px;border-radius:3px}
.table-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;font-size:14.5px;line-height:1.65;min-width:100%}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:var(--bg);white-space:nowrap}
td:first-child{min-width:5.5em;color:var(--muted)}
@media (min-width:800px){.swipe{display:none}}
tr:last-child td{border-bottom:0}
table strong{color:inherit}
.table-wrap:has(th:nth-child(5)) table{min-width:760px}
.note{font-size:13px;color:var(--muted)}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#gate form{width:100%;max-width:340px;text-align:center}
#gate h1{font-size:24px}
#gate p{color:var(--muted);font-size:14px;text-align:center}
#gate input{width:100%;font:inherit;padding:10px 12px;margin:18px 0 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);text-align:center;letter-spacing:.1em}
#gate button{width:100%;font:inherit;padding:10px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
#err{color:var(--accent);min-height:1.6em;font-size:14px}
</style>
</head>
<body>
<div id="gate">
  <form id="f">
    <h1>工作线记忆框架</h1>
    <p>邀请制浏览，请输入邀请码</p>
    <input id="c" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx" aria-label="邀请码">
    <button>进入</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<main id="doc" hidden></main>

async function open(code){
  const e=new TextEncoder(),k0=await crypto.subtle.importKey("raw",e.encode(code),"PBKDF2",false,["deriveKey"]);
