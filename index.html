<!doctype html>
<!-- 金色星空设计系统的网页版：星空做信头与信尾，正文落在象牙白纸面，墨蓝衬线字；
     浅底上不用渐层金字，重点字用深金 #9a6b2c。正文由 build.py 加密注入 -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>工作线记忆框架</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;600;900&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
:root{--navy:#060b1d;--ink:#1b2440;--muted:#5d6580;--paper:#fbf7ee;--paper-2:#f4ecdb;--gold-hi:#fbe7b5;--gold:#e7c27a;--gold-lo:#b8853f;--gold-ink:#9a6b2c;--gold-line:#d8b06a;--warm:#f3ecdf;
  --serif:'Noto Serif SC','Songti SC','Source Han Serif SC',STSong,serif;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--navy) url(assets/bg.webp) center top/cover fixed;color:var(--ink);font-family:var(--serif);min-height:100vh}
.g{background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gold-rule{height:3px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi) 50%,var(--gold-lo))}

/* ── 邀请码门 ── */
#gate{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:hidden}
#gate::before{content:"";position:absolute;inset:0;background:url(assets/fx.webp) center/cover;opacity:.7;pointer-events:none}
#gate form{position:relative;z-index:1;width:100%;max-width:360px;text-align:center}
.kicker{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.42em;color:var(--gold)}
#gate h1{white-space:nowrap;font-family:var(--serif);font-weight:900;font-size:clamp(34px,9vw,46px);letter-spacing:.12em;line-height:1.3;margin:14px 0 10px}
#gate p{font-family:var(--sans);color:var(--warm);font-size:14px;letter-spacing:.2em}
#gate input{width:100%;font:500 17px var(--sans);padding:12px 14px;margin:30px 0 12px;border:1px solid var(--gold-line);border-radius:2px;background:rgba(6,11,29,.55);color:var(--gold-hi);text-align:center;letter-spacing:.18em;outline:none}
#gate input:focus{box-shadow:0 0 0 3px rgba(216,176,106,.25)}
#gate input::placeholder{color:rgba(243,236,223,.35)}
#gate button{width:100%;font:700 16px var(--sans);letter-spacing:.5em;padding:12px 0 12px .5em;border:0;border-radius:2px;color:var(--navy);background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));cursor:pointer}
#err{font-family:var(--sans);color:var(--gold);min-height:1.8em;margin-top:10px;font-size:14px}

/* ── 正文页：信头＋纸面＋信尾 ── */
#doc{max-width:880px;margin:0 auto;padding:0 0 0;box-shadow:0 0 60px rgba(0,0,0,.5)}
.head{position:relative;overflow:hidden;background:var(--navy) url(assets/bg.webp) center 30%/cover;padding:64px 64px 52px;min-height:340px}
.head::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,11,29,.65),rgba(6,11,29,0) 75%);pointer-events:none}
.head>*{position:relative;z-index:1}
.head h1{font-weight:900;font-size:clamp(38px,7.4vw,64px);line-height:1.2;letter-spacing:.14em;margin:18px 0 18px}
.head .sub{font-family:var(--sans);font-weight:500;font-size:16px;letter-spacing:.14em;color:var(--warm)}
.head .by{font-family:var(--sans);font-size:14px;letter-spacing:.2em;color:var(--gold);margin-top:22px}
.body{background:var(--paper);padding:56px 72px 64px;font-size:17.5px;line-height:1.95}
.body h2{font-weight:900;font-size:23px;letter-spacing:.08em;margin:58px 0 20px;padding-bottom:12px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi) 40%,transparent 70%) left bottom/100% 2px no-repeat}
.body h2:first-child{margin-top:0}
.body p{margin:0 0 16px;text-align:justify}
.body ul,.body ol{margin:0 0 16px;padding-left:1.5em}
.body li{margin:6px 0;text-align:justify}
.body li::marker{color:var(--gold-lo)}
.body strong{color:var(--gold-ink);font-weight:700}
.body code{font-family:ui-monospace,Consolas,monospace;font-size:.86em;background:var(--paper-2);padding:1px 5px;border-radius:2px}
.note{font-family:var(--sans);font-size:13px;color:var(--muted)}

/* 表格 */
.table-wrap{margin:22px 0 22px;border-top:2px solid var(--gold-line);border-bottom:2px solid var(--gold-line)}
table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14.5px;line-height:1.7}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid #e6dcc8}
thead th{font-weight:700;color:var(--ink);background:var(--paper-2);font-size:14px}
th small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
td:first-child{font-weight:700;color:var(--gold-ink);white-space:nowrap}
tr:last-child td{border-bottom:0}
.cmp th:nth-child(2),.cmp td:nth-child(2){background:linear-gradient(180deg,rgba(216,176,106,.20),rgba(216,176,106,.10));color:var(--ink);font-weight:700}
.cmp thead th:nth-child(2){background:var(--navy);color:var(--gold-hi);border-bottom-color:var(--navy)}
.cmp td:not(:first-child):not(:nth-child(2)){color:var(--muted)}
.plain td:first-child{width:6.5em}

/* 落款 */
.sign{width:fit-content;margin:64px 0 0 auto;text-align:left;font-weight:600;font-size:18px;line-height:2}
.sign span{font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.2em;color:var(--gold-ink);margin-right:14px}
.sign .date{font-weight:400;font-size:16px;color:var(--muted)}
.foot{background:var(--navy) url(assets/bg.webp) center 85%/cover;padding:30px 24px 34px;text-align:center}
.foot .en{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.3em;margin-bottom:6px}
.foot .zh{font-family:var(--sans);font-size:12.5px;letter-spacing:.12em;color:rgba(243,236,223,.75)}

/* 手机：比较表转卡片，自家在每张卡最上面 */
@media (max-width:720px){
  .head{padding:44px 20px 36px;min-height:300px}
  .head .sub{font-size:14px;letter-spacing:.08em}
  .body{padding:40px 20px 48px;font-size:16.5px}
  .body h2{font-size:20px;margin-top:46px}
  .cmp{border:0}
  .cmp thead{display:none}
  .cmp table,.cmp tbody,.cmp tr,.cmp td{display:block;width:100%}
  .cmp tr{margin:0 0 16px;border:1px solid #e6dcc8;border-top:2px solid var(--gold-line);background:#fffdf8}
  .cmp td{border:0;padding:6px 14px;white-space:normal}
  .cmp td:first-child{font-size:15px;padding:10px 14px 4px;letter-spacing:.1em}
  .cmp td:not(:first-child)::before{content:attr(data-label);display:block;font-size:12px;color:var(--muted);font-weight:500}
  .cmp td:nth-child(2){background:rgba(216,176,106,.16);margin:2px 0 6px}
  .cmp td:nth-child(2)::before{color:var(--gold-ink);font-weight:700}
  .cmp td:last-child{padding-bottom:12px}
  .plain td:first-child{width:auto;padding-right:6px}
  table{font-size:14px}
  .sign{font-size:17px}
}
</style>
</head>
<body>
<div id="gate">
  
  <form id="f">
    <div class="kicker">HARNESS · CORE</div>
    <h1 class="g">工作线记忆框架</h1>
    <p>邀请制浏览　·　请输入邀请码</p>
    <input id="c" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx" aria-label="邀请码">
    <button>进入</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<main id="doc" hidden></main>

async function unlock(code){
  const e=new TextEncoder(),k0=await crypto.subtle.importKey("raw",e.encode(code),"PBKDF2",false,["deriveKey"]);
